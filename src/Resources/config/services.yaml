# src/Resources/config/services.yaml
services:
    Webgiciel2\InitBureauSecurite\:
        resource: '../../*'
        exclude: '../../{DependencyInjection,Entity,Tests}'

    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $proprioUsername: '%env(SECUR_PROPRIO_USERNAME)%'
            string $proprioEmail: '%env(SECUR_PROPRIO_EMAIL)%'
            string $techUsername: '%env(SECUR_TECH_USERNAME)%'
            string $techEmail: '%env(SECUR_TECH_EMAIL)%'
            string $appUrl: '%env(INIT_SECURITE_APP_URL)%'
            string $projectDir: '%kernel.project_dir%'

#    Webgiciel2\InitBureauSecurite\EventSubscriber\KernelRequestSubscriber:
#        arguments:
#            $initManager: '@Webgiciel2\InitBureauSecurite\Service\InitBureauSecuriteManager'
#        tags:
#            - { name: kernel.event_subscriber }



    Webgiciel2\InitBureauSecurite\:
        resource: '../vendor/webgiciel2/init-bureau-securite/src/*'
        autowire: true
        autoconfigure: true

    Webgiciel2\InitBureauSecurite\Service\InitBureauSecuriteManager:
        arguments:
            $proprioUsername: '%env(SECUR_PROPRIO_USERNAME)%'
            $proprioEmail: '%env(SECUR_PROPRIO_EMAIL)%'
            $techUsername: '%env(SECUR_TECH_USERNAME)%'
            $techEmail: '%env(SECUR_TECH_EMAIL)%'

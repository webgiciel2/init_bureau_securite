services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $proprioUsername: '%env(SECUR_PROPRIO_USERNAME)%'
            string $proprioEmail: '%env(SECUR_PROPRIO_EMAIL)%'
            string $techUsername: '%env(SECUR_TECH_USERNAME)%'
            string $techEmail: '%env(SECUR_TECH_EMAIL)%'
            string $appUrl: '%env(INIT_SECURITE_APP_URL)%'
            string $projectDir: '%kernel.project_dir%'

    Webgiciel2\InitBureauSecurite\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Resources/'
